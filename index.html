<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo Invisible</title>
<style>
  :root {
    --bg: #0f3326;
    --bg2: #174c38;
    --cream: #fbf5e9;
    --ink: #2b2118;
    --muted: #6d6254;
    --red: #c4372b;
    --red-d: #9f2a20;
    --gold: #e6b64f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: radial-gradient(1100px 600px at 50% -10%, var(--bg2), var(--bg)) fixed;
    color: var(--cream);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }
  body.lock { overflow: hidden; }

  .snow { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .snow i {
    position: absolute; top: -10px; background: #fff; border-radius: 50%;
    opacity: .45; animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translate(30px, 105vh); } }

  .wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 30px 18px 60px; }
  header { text-align: center; margin-bottom: 26px; }
  .eyebrow {
    margin: 0 0 4px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--gold); font-weight: 600;
  }
  h1 {
    margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 700;
    font-size: clamp(32px, 8vw, 46px); line-height: 1.1;
  }
  h2 { font-family: Georgia, "Times New Roman", serif; margin: 0 0 8px; font-size: 24px; }
  h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; }

  .progress { margin: 0 0 26px; }
  .progress-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #e9dfc8; }
  .bar { height: 8px; background: rgba(255,255,255,.16); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--gold); transition: width .4s ease; }

  section { margin-bottom: 30px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .section-head span { font-size: 13px; color: #cfc4a8; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .tile {
    appearance: none; border: 0; cursor: pointer; text-align: left;
    background: var(--cream); color: var(--ink);
    border-radius: 14px; padding: 14px 14px 12px; min-height: 76px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
    box-shadow: 0 2px 0 rgba(0,0,0,.25);
    transition: transform .12s ease, box-shadow .12s ease;
    font: inherit;
  }
  .tile:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  .tile:focus-visible, .btn:focus-visible, .link:focus-visible, .inp:focus-visible {
    outline: 3px solid var(--gold); outline-offset: 2px;
  }
  .tile-name { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
  .tile-sub { font-size: 12.5px; color: var(--red-d); font-weight: 600; }
  .tile.mine { background: #f3e2b3; }
  .tile.mine .tile-sub { color: var(--ink); }
  .tile:disabled {
    cursor: not-allowed; background: transparent; color: #cfc4a8;
    border: 1.5px dashed rgba(251,245,233,.35); box-shadow: none;
  }
  .tile:disabled .tile-sub { color: #9fd3a8; }

  .pool { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 99px; font-weight: 600; font-size: 15px;
    border: 1.5px solid var(--gold); color: var(--cream); background: rgba(230,182,79,.12);
  }
  .chip small { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .chip.gone { border: 1.5px dashed rgba(251,245,233,.3); background: transparent; color: #a99f88; }
  .chip.gone .nm { text-decoration: line-through; text-decoration-thickness: 1.5px; }

  .banner {
    background: var(--gold); color: var(--ink); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 22px; font-weight: 600;
  }
  .banner.warn { background: #f3d5ce; color: #5a1a12; }

  .foot { text-align: center; margin-top: 8px; }
  .link {
    appearance: none; background: none; border: 0; color: #cfc4a8; font: inherit; font-size: 14px;
    text-decoration: underline; cursor: pointer; padding: 8px;
  }
  .link:hover { color: var(--cream); }

  .btn {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 16px;
    padding: 13px 20px; border-radius: 12px; min-height: 48px;
  }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.primary { background: var(--red); color: #fff; box-shadow: 0 3px 0 var(--red-d); }
  .btn.primary:hover:not(:disabled) { background: #d3443a; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid rgba(43,33,24,.3); }
  .btn.ghost:hover { background: rgba(43,33,24,.06); }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  @media (min-width: 480px) { .actions { flex-direction: row-reverse; } .actions .btn { flex: 1; } }

  .card, .dialog {
    background: var(--cream); color: var(--ink); border-radius: 18px; padding: 24px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  .card p, .dialog p { margin: 0 0 8px; }
  .card { text-align: center; }
  .muted { color: var(--muted); font-size: 14.5px; }
  .inp {
    width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 10px;
    border: 1.5px solid rgba(43,33,24,.25); background: #fff; color: var(--ink);
  }
  textarea.inp { min-height: 190px; resize: vertical; line-height: 1.5; }
  .err { color: var(--red-d); font-weight: 600; min-height: 22px; margin: 8px 0 0 !important; }

  .overlay {
    position: fixed; inset: 0; z-index: 10; background: rgba(5,20,14,.72);
    display: flex; align-items: center; justify-content: center; padding: 18px;
  }
  .overlay[hidden] { display: none; }
  .dialog { width: 100%; max-width: 420px; max-height: 92vh; overflow: auto; text-align: center; animation: pop .22s ease; }
  .dialog.left { text-align: left; max-width: 460px; }
  .dialog .eyebrow { color: var(--red-d); }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  .spin {
    font-family: Georgia, "Times New Roman", serif; font-size: 34px; font-weight: 700;
    color: var(--red); min-height: 56px; margin: 14px 0 6px; overflow-wrap: anywhere;
  }
  .result {
    font-size: clamp(34px, 10vw, 46px); color: var(--red); margin: 6px 0 14px; overflow-wrap: anywhere;
    animation: pop .35s ease;
  }
  .hint { color: var(--muted); font-size: 14px; }

  @media (prefers-reduced-motion: reduce) {
    .snow { display: none; }
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="snow" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <p class="eyebrow">Sorteo</p>
    <h1>Amigo Invisible <span aria-hidden="true">🎁</span></h1>
  </header>
  <main id="app"></main>
  <div class="foot"><button class="link" type="button" id="admin-link">Soy la organizadora</button></div>
  <noscript><p>Esta página necesita JavaScript para funcionar.</p></noscript>
</div>

<div id="modal" class="overlay" hidden>
  <div id="dlg" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"></div>
</div>

<script>
(() => {
  'use strict';

  /* ================= CONFIGURACIÓN ================= */
  // Pegá acá la URL de tu Apps Script (termina en /exec). Ver instrucciones.
  const API_URL = 'https://script.google.com/macros/s/AKfycby8s76KMn-rtQcatuD7go53-4FSmaqdw6K57QsBXYZuMY9HbFLuV9Dl2nMVWPSEj_Fu/exec';
  const POLL_MS = 5000;   // cada cuánto se actualiza la lista

  /* ================= Utilidades ================= */
  const $ = s => document.querySelector(s);
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function rnd(n) {
    if (window.crypto && crypto.getRandomValues) {
      const a = new Uint32Array(1);
      const lim = Math.floor(4294967296 / n) * n;
      do { crypto.getRandomValues(a); } while (a[0] >= lim);
      return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }
  function randomHex(len) {
    let s = '';
    while (s.length < len) s += rnd(16).toString(16);
    return s;
  }

  // Elementos sin innerHTML: los nombres siempre se muestran como texto
  function h(tag, props = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else e.setAttribute(k, v);
    }
    kids.flat().forEach(c => { if (c != null && c !== false) e.append(c); });
    return e;
  }

  // localStorage / sessionStorage con tolerancia a que no estén disponibles
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  };
  const session = {
    get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* nada */ } },
    del(k) { try { sessionStorage.removeItem(k); } catch (e) { /* nada */ } }
  };

  /* ================= API ================= */
  const apiConfigured = !API_URL.includes('PEGAR_AQUI');

  async function api(action, params = {}) {
    const q = new URLSearchParams({ action, ...params });
    const res = await fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + q.toString(), { cache: 'no-store' });
    if (!res.ok) throw new Error('http ' + res.status);
    return res.json();
  }
  const NET_ERROR = { ok: false, code: 'network', error: 'No hay conexión con el servidor. Probá de nuevo en unos segundos.' };
  const safeApi = (action, params) => api(action, params).catch(() => NET_ERROR);

  /* ================= Estado ================= */
  let S = null;            // último estado público del servidor
  let offline = false;     // el último intento de actualizar falló
  let lastKey = '';

  // Cada celu tiene un código por participante: así puede volver a ver SU resultado y nadie más
  const tokKey = i => 'ai-tok-' + S.id + '-' + i;
  const hasTok = i => !!store.get(tokKey(i));
  function getTok(i) {
    let t = store.get(tokKey(i));
    if (!t) { t = randomHex(32); store.set(tokKey(i), t); }
    return t;
  }

  async function refresh(force) {
    if (!apiConfigured) return;
    const r = await safeApi('state');
    if (r.ok) {
      offline = false;
      S = r;
    } else {
      offline = true;
    }
    const key = JSON.stringify([S, offline]);
    if (force || key !== lastKey) { lastKey = key; render(); }
  }

  /* ================= Modal ================= */
  const modalEl = $('#modal');
  const dlg = $('#dlg');
  let dismissable = true;

  function openModal(nodes, { dismiss = true, wide = false } = {}) {
    dismissable = dismiss;
    dlg.className = 'dialog' + (wide ? ' left' : '');
    dlg.replaceChildren(...nodes);
    modalEl.hidden = false;
    document.body.classList.add('lock');
    const b = dlg.querySelector('input, textarea, button');
    if (b) b.focus();
  }
  function closeModal() {
    modalEl.hidden = true;
    document.body.classList.remove('lock');
    dlg.replaceChildren();
  }
  modalEl.addEventListener('click', e => { if (e.target === modalEl && dismissable) closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !modalEl.hidden && dismissable) closeModal();
  });

  /* ================= Pantallas ================= */
  function render() {
    const app = $('#app');
    if (!apiConfigured) {
      app.replaceChildren(h('div', { class: 'card' },
        h('h2', { text: 'Falta conectar el servidor' }),
        h('p', { class: 'muted', text: 'Hay que pegar la URL de Apps Script en la constante API_URL, al principio del script de esta página.' })));
      return;
    }
    if (!S) {
      app.replaceChildren(h('div', { class: 'card' },
        h('h2', { text: offline ? 'No pude conectar' : 'Cargando…' }),
        h('p', { class: 'muted', text: offline ? 'Revisá tu conexión. Reintento solo cada unos segundos.' : 'Un momento.' }),
        offline ? h('div', { class: 'actions' }, h('button', { class: 'btn primary', type: 'button', text: 'Reintentar', onclick: () => refresh(true) })) : null));
      return;
    }
    if (!S.configured) {
      app.replaceChildren(h('div', { class: 'card' },
        h('h2', { text: 'Todavía no hay sorteo' }),
        h('p', { class: 'muted', text: 'La organizadora todavía no cargó los nombres. Esta pantalla se actualiza sola, no hace falta recargar.' })));
      return;
    }
    renderGame();
  }

  function renderGame() {
    const app = $('#app');
    const N = S.names.length;
    const count = S.drawn.filter(Boolean).length;
    const goneCount = S.gone.filter(Boolean).length;
    const nodes = [];

    if (offline) {
      nodes.push(h('div', { class: 'banner warn', role: 'status', text: 'Sin conexión con el servidor. Sigo intentando…' }));
    }
    if (count === N) {
      nodes.push(h('div', { class: 'banner', text: '¡Sorteo completo! 🎉 Ya sacaron todos. Guarden el secreto hasta el día del intercambio.' }));
    }

    nodes.push(
      h('div', { class: 'progress' },
        h('div', { class: 'progress-row' },
          h('span', { text: count + ' de ' + N + ' ya sacaron' }),
          h('span', { text: (N - count) + ' pendientes' })),
        h('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(N), 'aria-valuenow': String(count) },
          h('i', { style: 'width:' + Math.round(count / N * 100) + '%' }))),

      h('section', {},
        h('div', { class: 'section-head' }, h('h3', { text: '¿Quién va a sacar?' })),
        h('div', { class: 'grid' }, S.names.map((n, i) => {
          const drawn = !!S.drawn[i];
          const mine = drawn && hasTok(i);
          const sub = mine ? '👁 Ver mi resultado' : drawn ? '✓ Ya sacó' : 'Tocá para sacar';
          return h('button', {
            class: 'tile' + (mine ? ' mine' : ''), type: 'button',
            disabled: drawn && !mine,
            onclick: () => (drawn ? viewResult(i) : openConfirm(i))
          },
            h('span', { class: 'tile-name', text: n }),
            h('span', { class: 'tile-sub', text: sub }));
        }))),

      h('section', {},
        h('div', { class: 'section-head' },
          h('h3', { text: 'Nombres todavía en juego' }),
          h('span', { text: (N - goneCount) + ' de ' + N })),
        h('ul', { class: 'pool' }, S.names.map((n, j) => {
          const gone = !!S.gone[j];
          return h('li', { class: 'chip' + (gone ? ' gone' : ''), 'aria-disabled': gone ? 'true' : null },
            h('span', { class: 'nm', text: n }), gone ? h('small', { text: 'salió' }) : null);
        })))
    );
    app.replaceChildren(...nodes);
  }

  /* ================= Sacar un nombre ================= */
  function openConfirm(i) {
    const name = S.names[i];
    openModal([
      h('h2', { id: 'dlg-title', text: '¿Sos ' + name + '?' }),
      h('p', { class: 'muted', text: 'Fijate que nadie más esté mirando la pantalla. Cuando salga tu amigo invisible, ese nombre queda bloqueado para todos.' }),
      h('div', { class: 'actions' },
        h('button', { class: 'btn primary', type: 'button', text: 'Sí, sacar mi amigo', onclick: () => startDraw(i) }),
        h('button', { class: 'btn ghost', type: 'button', text: 'No, volver', onclick: closeModal }))
    ]);
  }

  // Muestra nombres pasando mientras el servidor responde (el resultado ya lo define el servidor)
  function animate(shown, pool) {
    const total = (reduceMotion || pool.length < 2) ? 0 : 22;
    return new Promise(resolve => {
      let step = 0;
      (function tick() {
        if (step >= total) { setTimeout(resolve, total ? 350 : 150); return; }
        let j;
        do { j = pool[rnd(pool.length)]; } while (pool.length > 1 && S.names[j] === shown.textContent);
        shown.textContent = S.names[j];
        step++;
        setTimeout(tick, 55 + step * 9);
      })();
    });
  }

  async function startDraw(i) {
    const id = S.id;
    const tok = getTok(i);
    const pool = S.names.map((_, j) => j).filter(j => j !== i && !S.gone[j]);
    const shown = h('div', { class: 'spin', text: '…' });
    openModal([
      h('h2', { id: 'dlg-title', text: 'Sacando…' }),
      shown,
      h('p', { class: 'hint', text: 'Mezclando los nombres que quedan' })
    ], { dismiss: false });

    const [res] = await Promise.all([safeApi('draw', { i, id, tok }), animate(shown, pool)]);
    if (!res.ok) {
      showError(res);
    } else {
      showResult(S.names[i], res.result);
    }
    refresh(true);
  }

  async function viewResult(i) {
    openModal([h('h2', { id: 'dlg-title', text: 'Un momento…' })], { dismiss: false });
    const res = await safeApi('draw', { i, id: S.id, tok: getTok(i) });
    if (!res.ok) { showError(res); refresh(true); return; }
    showResult(S.names[i], res.result);
  }

  function showResult(giver, receiver) {
    openModal([
      h('p', { class: 'eyebrow', text: giver + ', tu amigo invisible es' }),
      h('h2', { id: 'dlg-title', class: 'result', text: receiver }),
      h('p', { class: 'muted', text: 'Si después te olvidás, volvé a entrar desde este mismo celular y tocá tu nombre para verlo de nuevo.' }),
      h('div', { class: 'actions' }, h('button', { class: 'btn primary', type: 'button', text: 'Listo', onclick: closeModal }))
    ], { dismiss: false });
  }

  function showError(res) {
    let msg = res.error || 'Algo salió mal.';
    if (res.code === 'network') msg += ' No se perdió tu turno.';
    openModal([
      h('h2', { id: 'dlg-title', text: 'No se pudo' }),
      h('p', { class: 'muted', text: msg }),
      h('div', { class: 'actions' }, h('button', { class: 'btn primary', type: 'button', text: 'Cerrar', onclick: closeModal }))
    ]);
  }

  /* ================= Organizadora ================= */
  $('#admin-link').addEventListener('click', () => {
    if (!apiConfigured) return;
    if (session.get('ai-pin')) openAdminPanel(); else openAdminLogin();
  });

  function openAdminLogin(msg) {
    const pin = h('input', { class: 'inp', type: 'password', autocomplete: 'off', placeholder: 'PIN', 'aria-label': 'PIN de organizadora' });
    const err = h('p', { class: 'err', role: 'alert', text: msg || '' });
    const go = h('button', { class: 'btn primary', type: 'submit', text: 'Entrar' });
    openModal([h('form', {
      onsubmit: async e => {
        e.preventDefault();
        go.disabled = true; err.textContent = '';
        const res = await safeApi('auth', { pin: pin.value });
        go.disabled = false;
        if (res.ok) { session.set('ai-pin', pin.value); openAdminPanel(); }
        else err.textContent = res.error;
      }
    },
      h('h2', { id: 'dlg-title', text: 'Organizadora' }),
      h('p', { class: 'muted', text: 'Ingresá el PIN que configuraste en el servidor.' }),
      pin, err,
      h('div', { class: 'actions' }, go, h('button', { class: 'btn ghost', type: 'button', text: 'Cancelar', onclick: closeModal })))
    ], { wide: true });
  }

  function openAdminPanel(msg) {
    const pin = session.get('ai-pin') || '';
    const started = S && S.configured && S.drawn.some(Boolean);
    const configured = S && S.configured;
    const area = h('textarea', {
      class: 'inp', 'aria-label': 'Nombres, uno por línea', spellcheck: 'false', disabled: !!started,
      placeholder: 'Un nombre por línea\nAna\nBeto\nCaro…'
    });
    area.value = configured ? S.names.join('\n') : '';
    const err = h('p', { class: 'err', role: 'alert', text: msg || '' });
    const save = h('button', { class: 'btn primary', type: 'button', text: configured ? 'Guardar nombres' : 'Crear sorteo' });
    let armed = false;
    const reset = h('button', { class: 'btn ghost', type: 'button', text: 'Reiniciar sorteo' });

    save.addEventListener('click', async () => {
      const names = area.value.split('\n').map(s => s.trim().replace(/\s+/g, ' ')).filter(Boolean);
      if (names.length < 3) { err.textContent = 'Cargá al menos 3 nombres, uno por línea.'; return; }
      const seen = new Set();
      for (const n of names) {
        if (n.length > 24) { err.textContent = 'Cada nombre puede tener hasta 24 letras: ' + n; return; }
        const k = n.toLocaleLowerCase('es');
        if (seen.has(k)) { err.textContent = 'Hay un nombre repetido: ' + n; return; }
        seen.add(k);
      }
      save.disabled = true; err.textContent = '';
      const res = await safeApi('setup', { pin, names: JSON.stringify(names) });
      save.disabled = false;
      if (res.ok) { closeModal(); await refresh(true); }
      else { if (res.code === 'bad_pin') session.del('ai-pin'); err.textContent = res.error; }
    });

    reset.addEventListener('click', async () => {
      if (!armed) { armed = true; reset.textContent = 'Tocá otra vez para confirmar'; return; }
      reset.disabled = true;
      const res = await safeApi('reset', { pin });
      if (res.ok) { closeModal(); S = null; lastKey = ''; await refresh(true); }
      else { reset.disabled = false; err.textContent = res.error; }
    });

    const info = !configured ? 'Todavía no hay sorteo. Cargá los nombres y creá uno.'
      : started ? 'Ya sacaron ' + S.drawn.filter(Boolean).length + ' de ' + S.names.length + '. Los nombres no se pueden editar una vez empezado el sorteo; para cambiarlos hay que reiniciarlo.'
      : 'Todavía nadie sacó: podés corregir los nombres y guardar (el sorteo se vuelve a armar).';

    openModal([
      h('h2', { id: 'dlg-title', text: 'Organizadora' }),
      h('p', { class: 'muted', text: info }),
      area, err,
      h('div', { class: 'actions' },
        started ? null : save,
        configured ? reset : null,
        h('button', { class: 'btn ghost', type: 'button', text: 'Cerrar', onclick: closeModal }))
    ], { wide: true });
  }

  /* ================= Arranque ================= */
  if (!reduceMotion) {
    const snow = $('.snow');
    for (let k = 0; k < 22; k++) {
      const d = document.createElement('i');
      const size = 3 + rnd(4);
      d.style.left = rnd(100) + '%';
      d.style.width = d.style.height = size + 'px';
      d.style.animationDuration = (8 + rnd(10)) + 's';
      d.style.animationDelay = '-' + rnd(18) + 's';
      snow.append(d);
    }
  }

  render();
  refresh(true);
  setInterval(() => { if (!document.hidden) refresh(false); }, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(false); });
})();
</script>
</body>
</html>
